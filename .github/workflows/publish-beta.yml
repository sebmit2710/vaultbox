name: Publish approved Vaultbox beta

on:
  push:
    branches:
      - main
    paths:
      - .github/beta-release-request.json

permissions:
  contents: write

jobs:
  publish-beta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Verify beta release metadata and assets
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const request = JSON.parse(fs.readFileSync('.github/beta-release-request.json', 'utf8'));
          const manifest = JSON.parse(fs.readFileSync('manifest.json', 'utf8'));
          const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          const versions = JSON.parse(fs.readFileSync('versions.json', 'utf8'));
          if (!/^1\.0\.11-beta\.2$/.test(request.tag)) throw new Error('Unexpected beta tag');
          if ([manifest.version,pkg.version,lock.version,lock.packages[''].version].some(v=>v!==request.tag)) {
            throw new Error('Release version mismatch');
          }
          if (versions[request.tag]!==manifest.minAppVersion) throw new Error('Obsidian version map mismatch');
          for (const file of ['main.js', 'manifest.json', 'styles.css']) {
            if (!fs.statSync(file).size) throw new Error('Missing or empty asset: '+file);
          }
          console.log('All beta release metadata and assets verified:',request.tag);
          NODE
      - name: Publish immutable prerelease assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./.github/beta-release-request.json').tag")
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "::error::Release $VERSION already exists; refusing to overwrite."
            exit 1
          fi
          gh release create "$VERSION" --target "$GITHUB_SHA" --prerelease \
            --title "Vaultbox $VERSION" --notes-file .github/beta-release-notes.md \
            main.js manifest.json styles.css
          gh release view "$VERSION" --json tagName,isPrerelease,assets,url
